name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to npm and GitHub
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the GitHub release
      id-token: write # for npm's trusted publishing, so no token is stored
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        run: |
          # A pre-release, such as v1.0.0-rc.1, goes to next rather than latest
          tag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag=(--tag next)
          fi
          npm publish --provenance --access public "${tag[@]}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
