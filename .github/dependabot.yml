version: 2
updates:
  # Minor and patch updates come together each month; the rest come one at a time
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
        # 0.x packages, where a minor update can break: pptx-automizer fills every slide
        exclude-patterns: ['pptx-automizer', '@xmldom/xmldom']
        update-types: [minor, patch]
    ignore:
      # Its major version follows the oldest Node tycoslide supports (24), not the latest
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
